<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>.....</title>
    <style>
      :root {
        --bg1: #0f1020;
        --bg2: #1b1f35;
        --pink: #ff5fa2;
        --pink-2: #ff87c1;
        --glow: #ffd6e9;
        --text: #f7f7fb;
      }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        height: 100vh;
        background: radial-gradient(
          1200px 800px at 20% 10%,
          #23284a 0%,
          var(--bg2) 40%,
          var(--bg1) 100%
        );
        color: var(--text);
        font-family: Arial, sans-serif;
        overflow: hidden;
      }
      .wrap {
        text-align: center;
        transition: opacity 0.8s ease;
      }
      h1 {
        margin: 0 0 80px;
        font-weight: 800;
        font-size: clamp(24px, 4vw, 40px);
        text-shadow: 0 4px 24px rgba(255, 95, 162, 0.35);
      }
      /* Heart */
      .heart {
        position: relative;
        width: 140px;
        height: 140px;
        margin: 40px auto;
        transform: rotate(-45deg);
        background: linear-gradient(135deg, var(--pink), var(--pink-2));
        border-radius: 16px;
        animation: beat 1s infinite;
      }
      .heart::before,
      .heart::after {
        content: "";
        position: absolute;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: inherit;
      }
      .heart::before {
        top: -70px;
        left: 0;
      }
      .heart::after {
        left: 70px;
        top: 0;
      }
      @keyframes beat {
        0%,
        100% {
          transform: rotate(-45deg) scale(1);
        }
        25% {
          transform: rotate(-45deg) scale(1.06);
        }
        75% {
          transform: rotate(-45deg) scale(1.1);
        }
      }

      /* Buttons */
      .buttons {
        margin-top: 80px; /* tăng khoảng cách giữa tim và nút */
      }
      .btn {
        padding: 12px 18px;
        border-radius: 999px;
        font-weight: 700;
        background: linear-gradient(90deg, var(--pink), var(--pink-2));
        color: #12121a;
        border: none;
        cursor: pointer;
        box-shadow: 0 12px 30px rgba(255, 95, 162, 0.35);
        transition: transform 0.3s ease; /* hiệu ứng phóng to */
      }
      .btn.secondary {
        margin-left: 20px;
        background: transparent;
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: none;
      }
      /* hiệu ứng phóng to */
      .enlarge {
        transform: scale(1.2);
      }

      /* Nổ tim */
      .mini-heart {
        position: absolute;
        width: 20px;
        height: 20px;
        background: linear-gradient(135deg, var(--pink), var(--pink-2));
        transform: rotate(-45deg);
        border-radius: 4px;
        animation: explode 1s forwards;
      }
      .mini-heart::before,
      .mini-heart::after {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: inherit;
      }
      .mini-heart::before {
        top: -10px;
        left: 0;
      }
      .mini-heart::after {
        left: 10px;
        top: 0;
      }
      @keyframes explode {
        from {
          opacity: 1;
          transform: translate(0, 0) scale(1) rotate(-45deg);
        }
        to {
          opacity: 0;
          transform: translate(var(--x), var(--y)) scale(0.6) rotate(180deg);
        }
      }

      /* Ảnh */
      .image-container {
        position: fixed;
        bottom: -100%;
        left: 50%;
        transform: translateX(-50%);
        opacity: 0;
        transition: all 1.5s ease;
      }
      .image-container.show {
        bottom: 50%;
        transform: translate(-50%, 50%) scale(1.05);
        opacity: 1;
      }
      .image-container img {
        width: 300px;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(255, 95, 162, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="content">
      <h1>Anh đồng ý làm người yêu em nhé 💖</h1>
      <div class="heart" id="mainHeart"></div>
      <div class="buttons">
        <button class="btn" id="acceptBtn">Đồng ý 💞</button>
        <button class="btn secondary" id="declineBtn">Từ chối 🙅‍♂️</button>
      </div>
    </div>

    <div class="image-container" id="finalImage">
      <img src="hihi.png" alt="Love Image" />
    </div>

    <script>
      const declineBtn = document.getElementById("declineBtn");
      const acceptBtn = document.getElementById("acceptBtn");
      const wrap = document.getElementById("content");
      const finalImage = document.getElementById("finalImage");
      const mainHeart = document.getElementById("mainHeart");
      let clickCount = 0;

      // Nút từ chối chạy
      declineBtn.addEventListener("click", () => {
        clickCount++;
        const x = ((Math.random() - 0.5) * window.innerWidth) / 1.2;
        const y = ((Math.random() - 0.5) * window.innerHeight) / 1.2;
        declineBtn.style.transform = `translate(${x}px, ${y}px)`;

        if (clickCount >= 5) {
          declineBtn.style.display = "none";
          acceptBtn.classList.add("enlarge"); // nút đồng ý phóng to
        }
      });

      // Đồng ý
      acceptBtn.addEventListener("click", () => {
        // tạo hiệu ứng nổ tim
        const rect = mainHeart.getBoundingClientRect();
        for (let i = 0; i < 20; i++) {
          const mini = document.createElement("div");
          mini.className = "mini-heart";
          mini.style.left = rect.left + rect.width / 2 + "px";
          mini.style.top = rect.top + rect.height / 2 + "px";
          const angle = Math.random() * Math.PI * 2;
          const dist = 80 + Math.random() * 100;
          mini.style.setProperty("--x", `${Math.cos(angle) * dist}px`);
          mini.style.setProperty("--y", `${Math.sin(angle) * dist}px`);
          document.body.appendChild(mini);
          setTimeout(() => mini.remove(), 1000);
        }
        mainHeart.style.display = "none";
        wrap.style.opacity = "0";

        setTimeout(() => {
          wrap.style.display = "none";
          finalImage.classList.add("show");
        }, 1200);
      });
    </script>
  </body>
</html>
